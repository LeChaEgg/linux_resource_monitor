# Copy this to hosts.toml and edit, then run:
#   srmon report --inventory hosts.toml --month 2026-05
# (or default to the current month by omitting --month).
#
# One report is generated per host under reports/<name>/<YYYY-MM>/. Hosts with no
# new in-month data are skipped, and a host already reported with no new data is
# skipped too.

